[project]
name = "secjobs"
version = "0.1.0"
description = "Local, private cybersecurity job-application assistant (Ollama + Lever)"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "pyyaml>=6.0", "playwright>=1.45", "fpdf2>=2.7", "python-dotenv>=1.0", "rich>=13.0"]

[project.scripts]
secjobs = "secjobs.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["secjobs"]
